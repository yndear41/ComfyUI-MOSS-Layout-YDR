[project]
name = "comfyui-moss-layout-ydr"
version = "0.1.0"
description = "Visual ComfyUI node for composing MOSS-Image layout prompts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
]
keywords = ["ComfyUI", "MOSS-Image", "layout", "prompt", "bounding-box"]
