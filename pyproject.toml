[project]
name = "moss-layout-ydr"
version = "0.1.0"
description = "Visual layout editor for MOSS-Image prompts with interactive boxes and canvas controls"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
]
keywords = ["ComfyUI", "MOSS-Image", "layout", "prompt", "bounding-box"]

[project.urls]
Repository = "https://github.com/yndear41/ComfyUI-MOSS-Layout-YDR"
Documentation = "https://github.com/yndear41/ComfyUI-MOSS-Layout-YDR#readme"
"Bug Tracker" = "https://github.com/yndear41/ComfyUI-MOSS-Layout-YDR/issues"

[tool.comfy]
PublisherId = "yndear41"
DisplayName = "MOSS Layout YDR"

